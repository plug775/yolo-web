<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบโมเดล YOLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
:root {
  --paper: #E8EDF0;
  --surface: #F6F8F9;
  --ink: #15232E;
  --muted: #586A77;
  --line: #C6D0D7;
  --stage: #D3DCE2;
  --accent: #0D6B6B;
  --accent-ink: #FFFFFF;
  --danger: #A3332B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E161C;
    --surface: #152028;
    --ink: #E3EAEF;
    --muted: #93A3AF;
    --line: #2A3946;
    --stage: #0A1116;
    --accent: #4DB3AD;
    --accent-ink: #0E161C;
    --danger: #F08A80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
h1 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.who { color: var(--muted); font-size: 15px; text-align: right; }
.who b { color: var(--ink); font-weight: 600; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } .who { text-align: left; } }

.stage {
  position: relative;
  background: var(--stage);
  border-radius: 14px;
  min-height: 420px;
  display: grid; place-items: center;
  overflow: hidden;
  outline: 2px dashed transparent; outline-offset: -10px;
  transition: outline-color .15s;
}
.stage.drag { outline-color: var(--accent); }
.stage canvas { display: block; max-width: 100%; height: auto; max-height: 78vh; }
.empty { text-align: center; padding: 40px 24px; color: var(--muted); }
.empty p { margin: 0 0 16px; font-size: 18px; color: var(--ink); }
.empty small { display: block; margin-top: 12px; }
.busy {
  position: absolute; inset: 0; display: none; place-items: center;
  background: color-mix(in srgb, var(--stage) 70%, transparent);
  font-weight: 600;
}
.stage.working .busy { display: grid; }

.btn {
  display: inline-block; cursor: pointer; border: 0; border-radius: 10px;
  padding: 10px 18px; font: inherit; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
}
.btn.big { display: block; width: 100%; padding: 14px 18px; font-size: 18px; text-align: center; margin-bottom: 18px; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

.samples { margin-top: 14px; }
.samples h2, aside h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.strip button {
  flex: 0 0 auto; width: 92px; height: 92px; padding: 0; border: 0; border-radius: 10px;
  overflow: hidden; cursor: pointer; background: var(--stage);
}
.strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.status { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.status.ok::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }
.status.error { color: var(--danger); }
.ctrl { margin-bottom: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--paper); margin-bottom: 16px; }
.seg button {
  font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 9px 8px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg-note { font-size: 13px; color: var(--muted); margin: -8px 0 16px; }
.ctrl label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.summary { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
ul.hits { list-style: none; margin: 0; padding: 0; }
ul.hits li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
ul.hits .sw { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
ul.hits .pc { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-top: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">ทดสอบโมเดล YOLO</h1>
    <div class="who" id="who"></div>
  </header>

  <main>
    <section>
      <div class="stage" id="stage">
        <div class="empty" id="empty">
          <p>อัปโหลดรูปก่อน แล้วกด "สแกนด้วย AI"</p>
          <label class="btn" id="pickBtn" aria-disabled="true">เลือกรูป
            <input type="file" id="file" accept="image/*" disabled>
          </label>
          <small>วางรูปด้วย Ctrl+V ก็ได้ รูปไม่ถูกส่งออกไปไหน ทายในเบราว์เซอร์ทั้งหมด</small>
        </div>
        <canvas id="view" hidden></canvas>
        <div class="busy">AI กำลังสแกน…</div>
      </div>
      <div class="samples" id="samplesBox" hidden>
        <h2>หรือลองกับรูปตัวอย่าง</h2>
        <div class="strip" id="strip"></div>
      </div>
    </section>

    <aside>
      <div class="status" id="status">กำลังโหลดโมเดล…</div>
      <button class="btn big" id="scanBtn" disabled>สแกนด้วย AI</button>
      <div class="seg" role="group" aria-label="แบบของโมเดล">
        <button type="button" id="modePoly" aria-pressed="true">Polygon</button>
        <button type="button" id="modeRect" aria-pressed="false" disabled>Rectangle</button>
      </div>
      <p class="seg-note" id="modeNote">Polygon = ระบายตามรูปทรงวัตถุ (Segment)</p>
      <div class="ctrl">
        <label for="conf"><span>ความมั่นใจขั้นต่ำ</span><span id="confVal">25%</span></label>
        <input type="range" id="conf" min="5" max="95" step="5" value="25">
      </div>
      <p class="summary" id="summary">ยังไม่มีรูป</p>
      <ul class="hits" id="hits"></ul>
      <div class="legend" id="legend"></div>
      <div class="actions">
        <label class="btn ghost" id="againBtn" hidden>เปลี่ยนรูป
          <input type="file" id="file2" accept="image/*">
        </label>
        <button class="btn ghost" id="saveBtn" hidden>บันทึกรูปผลลัพธ์</button>
      </div>
    </aside>
  </main>
</div>

<script>
const ORT_VER = '1.20.1';
const PALETTE = ['#E6194B', '#2E9E4F', '#4363D8', '#F58231', '#911EB4', '#16A9C9', '#D63CC9', '#8DB600', '#469990', '#9A6324', '#800000', '#000075'];
const $ = (s) => document.querySelector(s);
const sessions = { poly: null, rect: null };
let mode = 'poly', names = [], S = 640, last = null;
const MODE_LABEL = { poly: 'Polygon', rect: 'Rectangle' };
const MODE_NOTE = { poly: 'Polygon = ระบายตามรูปทรงวัตถุ (Segment)', rect: 'Rectangle = ตีกรอบสี่เหลี่ยม (Detect)' };

const color = (c) => PALETTE[c % PALETTE.length];
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

function setStatus(text, kind) {
  const el = $('#status'); el.textContent = text; el.className = 'status ' + (kind || '');
}

async function init() {
  let info;
  try {
    const res = await fetch('model_info.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    info = await res.json();
  } catch (e) {
    setStatus('โหลด model_info.json ไม่ได้ ถ้าเปิดไฟล์ index.html จากเครื่องตรงๆ จะใช้ไม่ได้ ต้องเปิดผ่าน GitHub Pages หรือ local server', 'error');
    return;
  }
  names = info.names || []; S = info.imgsz || 640;
  if (info.title) { $('#title').textContent = info.title; document.title = info.title; }
  const who = [];
  if (info.author) who.push(`<b>${info.author}</b>`);
  if (info.studentId) who.push(info.studentId);
  if (info.course) who.push(info.course);
  $('#who').innerHTML = who.join('<br>');
  $('#legend').innerHTML = names.map((n, i) => `<span><i style="background:${color(i)}"></i>${n}</span>`).join('');

  if (info.samples && info.samples.length) {
    $('#samplesBox').hidden = false;
    $('#strip').innerHTML = info.samples.map((s, i) =>
      `<button type="button" data-src="${s}" aria-label="รูปตัวอย่าง ${i + 1}"><img src="${s}" alt="" loading="lazy"></button>`).join('');
    $('#strip').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (b && sessions[mode]) loadSrc(b.dataset.src);
    });
  }

  ort.env.wasm.wasmPaths = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VER}/dist/`;
  ort.env.wasm.numThreads = 1;
  const opt = { executionProviders: ['wasm'] };
  const [poly, rect] = await Promise.allSettled([
    ort.InferenceSession.create(info.model || 'model.onnx', opt),
    info.rect_model ? ort.InferenceSession.create(info.rect_model, opt) : Promise.reject(new Error('ไม่มี rect_model')),
  ]);
  if (poly.status === 'fulfilled') sessions.poly = poly.value;
  if (rect.status === 'fulfilled') sessions.rect = rect.value;
  if (!sessions.poly && !sessions.rect) {
    setStatus('โหลดโมเดลไม่ได้: ' + (poly.reason?.message || ''), 'error');
    return;
  }
  $('#modePoly').disabled = !sessions.poly;
  $('#modeRect').disabled = !sessions.rect;
  if (!sessions.poly) setMode('rect', false);
  const ready = ['poly', 'rect'].filter((m) => sessions[m]).map((m) => MODE_LABEL[m]).join(' + ');
  setStatus(`โมเดลพร้อม · ${ready} · ${names.length} class`, 'ok');
  $('#file').disabled = false; $('#pickBtn').removeAttribute('aria-disabled');
}

// ---------- preprocess ----------
function letterbox(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const r = Math.min(S / w, S / h);
  const nw = Math.round(w * r), nh = Math.round(h * r);
  const dx = Math.round((S - nw) / 2 - 0.1), dy = Math.round((S - nh) / 2 - 0.1);
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = 'rgb(114,114,114)'; x.fillRect(0, 0, S, S);
  x.drawImage(img, dx, dy, nw, nh);
  const d = x.getImageData(0, 0, S, S).data, a = S * S, f = new Float32Array(3 * a);
  for (let i = 0; i < a; i++) {
    f[i] = d[i * 4] / 255; f[i + a] = d[i * 4 + 1] / 255; f[i + 2 * a] = d[i * 4 + 2] / 255;
  }
  return { tensor: new ort.Tensor('float32', f, [1, 3, S, S]), r, dx, dy, nw, nh, w, h };
}

// ---------- decode (รองรับ YOLOv8/11 และ YOLO26 แบบ end-to-end) ----------
function decode(det, nm, conf, nc) {
  const [, a, b] = det.dims, d = det.data, out = [];
  if (b === 6 + nm && a !== 4 + nc + nm) {           // YOLO26: [1, 300, 6+nm] = x1 y1 x2 y2 score cls coef...
    for (let i = 0; i < a; i++) {
      const o = i * b, s = d[o + 4];
      if (s < conf) continue;
      out.push({ x1: d[o], y1: d[o + 1], x2: d[o + 2], y2: d[o + 3], score: s, cls: Math.round(d[o + 5]), coef: d.slice(o + 6, o + 6 + nm) });
    }
    return out;
  }
  const C = 4 + nc + nm, chFirst = a === C, N = chFirst ? b : a;
  if (!chFirst && b !== C) throw new Error(`output [${det.dims}] ไม่ตรงกับจำนวน class ${nc} ใน model_info.json`);
  const at = chFirst ? (k, i) => d[k * N + i] : (k, i) => d[i * C + k];
  for (let i = 0; i < N; i++) {
    let best = 0, bc = -1;
    for (let c = 0; c < nc; c++) { const s = at(4 + c, i); if (s > best) { best = s; bc = c; } }
    if (best < conf) continue;
    const cx = at(0, i), cy = at(1, i), w = at(2, i), h = at(3, i);
    const coef = new Float32Array(nm);
    for (let j = 0; j < nm; j++) coef[j] = at(4 + nc + j, i);
    out.push({ x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2, score: best, cls: bc, coef });
  }
  return nms(out, 0.45);
}
function iou(p, q) {
  const iw = Math.max(0, Math.min(p.x2, q.x2) - Math.max(p.x1, q.x1));
  const ih = Math.max(0, Math.min(p.y2, q.y2) - Math.max(p.y1, q.y1));
  const inter = iw * ih, u = (p.x2 - p.x1) * (p.y2 - p.y1) + (q.x2 - q.x1) * (q.y2 - q.y1) - inter;
  return u > 0 ? inter / u : 0;
}
function nms(boxes, th) {
  boxes.sort((p, q) => q.score - p.score);
  const keep = [];
  for (const b of boxes) {
    if (keep.every((k) => k.cls !== b.cls || iou(k, b) < th)) keep.push(b);
    if (keep.length >= 300) break;
  }
  return keep;
}

// ---------- run + draw ----------
async function infer(m) {
  if (!last || last.out[m] || !sessions[m]) return;
  const sess = sessions[m];
  const t0 = performance.now();
  const res = await sess.run({ [sess.inputNames[0]]: last.lb.tensor });
  const ms = performance.now() - t0;
  let det = null, proto = null;
  for (const k of sess.outputNames) { const o = res[k]; if (o.dims.length === 4) proto = o; else det = o; }
  if (m === 'poly' && !proto) throw new Error('โมเดล Polygon ไม่มี mask output (ต้องเป็นรุ่น -seg)');
  last.out[m] = { det, proto, ms };
}

async function withBusy(fn) {
  $('#stage').classList.add('working');
  await new Promise((r) => setTimeout(r, 20));
  try { await fn(); } catch (e) { setStatus('ทายไม่สำเร็จ: ' + e.message, 'error'); }
  finally { $('#stage').classList.remove('working'); }
}

// 1) อัปโหลด: แสดงรูปเฉยๆ ยังไม่สแกน
function run(img) {
  last = { img, lb: null, out: {}, scanned: false };
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = $('#view');
  cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  $('#empty').hidden = true; $('#view').hidden = false;
  $('#againBtn').hidden = false; $('#saveBtn').hidden = true;
  $('#scanBtn').disabled = false;
  $('#summary').textContent = 'กด "สแกนด้วย AI" ได้เลย';
  $('#hits').innerHTML = '';
  setStatus('อัปโหลดรูปแล้ว รอสแกน', 'ok');
}

// 2) สแกน: รันทั้ง Polygon และ Rectangle แล้วแสดงตามปุ่มที่เลือก
async function scan() {
  if (!last) return;
  $('#scanBtn').disabled = true;
  await withBusy(async () => {
    last.lb = last.lb || letterbox(last.img);
    for (const m of ['poly', 'rect']) await infer(m);
    last.scanned = true;
    draw();
    $('#saveBtn').hidden = false;
  });
  $('#scanBtn').disabled = false;
}

async function setMode(m, rerun = true) {
  if (!sessions[m]) return;
  mode = m;
  $('#modePoly').setAttribute('aria-pressed', m === 'poly');
  $('#modeRect').setAttribute('aria-pressed', m === 'rect');
  $('#modeNote').textContent = MODE_NOTE[m];
  if (rerun && last && last.scanned) await withBusy(async () => { await infer(m); draw(); });
}

function draw() {
  if (!last || !last.scanned || !last.out[mode]) return;
  const { lb, img } = last;
  const { det, proto, ms } = last.out[mode];
  const conf = +$('#conf').value / 100;
  const nm = proto ? proto.dims[1] : 0;
  const boxes = decode(det, nm, conf, names.length);

  const k = Math.min(1, 1600 / Math.max(lb.w, lb.h));
  const W = Math.round(lb.w * k), H = Math.round(lb.h * k);
  const cv = $('#view'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  ctx.drawImage(img, 0, 0, W, H);

  // Polygon: ระบาย mask ที่ความละเอียดของ proto แล้วขยายทับรูป
  if (mode === 'poly') {
  const mh = proto.dims[2], mw = proto.dims[3], P = proto.data, area = mh * mw;
  const m = document.createElement('canvas'); m.width = mw; m.height = mh;
  const mx = m.getContext('2d'), md = mx.createImageData(mw, mh);
  const sx = mw / S, sy = mh / S;
  for (const b of [...boxes].reverse()) {
    const [r, g, bl] = hexRGB(color(b.cls));
    const x1 = Math.max(0, Math.floor(b.x1 * sx)), x2 = Math.min(mw, Math.ceil(b.x2 * sx));
    const y1 = Math.max(0, Math.floor(b.y1 * sy)), y2 = Math.min(mh, Math.ceil(b.y2 * sy));
    for (let y = y1; y < y2; y++) for (let x = x1; x < x2; x++) {
      const p = y * mw + x;
      let s = 0;
      for (let j = 0; j < nm; j++) s += b.coef[j] * P[j * area + p];
      if (s > 0) { const q = p * 4; md.data[q] = r; md.data[q + 1] = g; md.data[q + 2] = bl; md.data[q + 3] = 130; }
    }
  }
  mx.putImageData(md, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(m, lb.dx * sx, lb.dy * sy, lb.nw * sx, lb.nh * sy, 0, 0, W, H);
  }

  // กรอบ + ป้ายชื่อ
  const fs = Math.max(13, Math.round(W / 55)), lw = Math.max(2, Math.round(W / 400));
  ctx.font = `600 ${fs}px "IBM Plex Sans Thai", sans-serif`;
  ctx.textBaseline = 'top';
  const toImg = (v, d) => ((v - d) / lb.r) * k;
  for (const b of boxes) {
    const x = toImg(b.x1, lb.dx), y = toImg(b.y1, lb.dy);
    const w = toImg(b.x2, lb.dx) - x, h = toImg(b.y2, lb.dy) - y;
    const c = color(b.cls);
    if (mode === 'rect') { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
    const t = `${names[b.cls] ?? b.cls} ${Math.round(b.score * 100)}%`;
    const tw = ctx.measureText(t).width + fs * 0.6, th = fs * 1.45;
    const ty = y - th < 0 ? y : y - th;
    ctx.fillStyle = c; ctx.fillRect(x - lw / 2, ty, tw, th);
    const [r, g, bl] = hexRGB(c);
    ctx.fillStyle = r * 0.299 + g * 0.587 + bl * 0.114 > 150 ? '#111' : '#fff';
    ctx.fillText(t, x + fs * 0.3, ty + fs * 0.2);
  }

  // รายการผล
  $('#summary').textContent = boxes.length ? `เจอ ${boxes.length} ชิ้น` : 'ไม่เจออะไรเลย ลองลดความมั่นใจลง';
  $('#hits').innerHTML = boxes.map((b) =>
    `<li><span class="sw" style="background:${color(b.cls)}"></span>${names[b.cls] ?? b.cls}<span class="pc">${(b.score * 100).toFixed(1)}%</span></li>`).join('');
  setStatus(`${MODE_LABEL[mode]} · ทายเสร็จใน ${Math.round(ms)} ms`, 'ok');
}

// ---------- input ----------
function loadSrc(src) {
  const img = new Image();
  img.onload = () => run(img);
  img.onerror = () => setStatus('เปิดรูปนี้ไม่ได้', 'error');
  img.src = src;
}
function loadFile(f) {
  if (!f || !sessions[mode]) return;
  if (!f.type.startsWith('image/')) { setStatus('ไฟล์นี้ไม่ใช่รูปภาพ', 'error'); return; }
  loadSrc(URL.createObjectURL(f));
}
$('#file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
$('#file2').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
$('#conf').addEventListener('input', (e) => { $('#confVal').textContent = e.target.value + '%'; draw(); });
$('#scanBtn').addEventListener('click', scan);
$('#modePoly').addEventListener('click', () => setMode('poly'));
$('#modeRect').addEventListener('click', () => setMode('rect'));
$('#saveBtn').addEventListener('click', () => {
  const a = document.createElement('a'); a.download = `yolo_${MODE_LABEL[mode].toLowerCase()}.png`; a.href = $('#view').toDataURL('image/png'); a.click();
});
const stage = $('#stage');
['dragenter', 'dragover'].forEach((t) => stage.addEventListener(t, (e) => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave', 'drop'].forEach((t) => stage.addEventListener(t, (e) => { e.preventDefault(); stage.classList.remove('drag'); }));
stage.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));
window.addEventListener('paste', (e) => {
  const it = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (it) loadFile(it.getAsFile());
});

init();
</script>
</body>
</html>
